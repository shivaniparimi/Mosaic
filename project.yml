name: Mosaic
options:
  bundleIdPrefix: com.shivaniparimi
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Mosaic:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Mosaic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shivaniparimi.Mosaic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Mosaic/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Mosaic uses your location to remind you about tasks when you arrive at or leave a place you've chosen, like home or work."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Mosaic uses your location to remind you about tasks when you arrive at or leave a place you've chosen, even when the app isn't open."
        NSCalendarsFullAccessUsageDescription: "Mosaic uses your calendar to show your events alongside your tasks in Upcoming."
    scheme:
      testTargets:
        - MosaicTests
      config:
        Run: Debug
        Test: Debug
  MosaicTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MosaicTests
    dependencies:
      - target: Mosaic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shivaniparimi.MosaicTests
        GENERATE_INFOPLIST_FILE: "YES"
